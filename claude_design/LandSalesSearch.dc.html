<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/industry-f4035e7d-525b-4f20-b25f-6e55ddf79c74/styles.css">
  <script src="_ds/industry-f4035e7d-525b-4f20-b25f-6e55ddf79c74/_ds_bundle.js"></script>
  <script src="./image-slot.js"></script>
  <style>
    body { margin: 0; background: var(--color-bg); }
    a { color: var(--color-accent-700); text-decoration: none; }
    a:hover { color: var(--color-accent-900); text-decoration: underline; }
  </style>
</helmet>
<div style="min-height:100vh;width:100%;font-family:var(--font-body);display:flex;flex-direction:column;">

  <header style="position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--color-neutral-300); display: flex; align-items: center; justify-content: space-between; padding: var(--space-4) var(--space-6); box-sizing: border-box; background-color: var(--color-accent)">
    <a href="Search.dc.html" style="display:flex;align-items:center;gap:var(--space-3);text-decoration:none;">
      <div class="blueprint" style="position:relative;width:32px;height:32px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent-700)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="stroke: var(--color-accent-200)"><path d="M3 21h18" stroke="var(--color-accent-200)"></path><path d="M5 21V7l8-4v18" stroke="var(--color-accent-200)"></path><path d="M19 21V11l-6-4" stroke="var(--color-accent-200)"></path><path d="M9 9v.01" stroke="var(--color-accent-200)"></path><path d="M9 12v.01" stroke="var(--color-neutral-400)"></path><path d="M9 15v.01" stroke="var(--color-accent-200)"></path><path d="M9 18v.01" stroke="var(--color-accent-200)"></path></svg>
      </div>
      <span style="font-family: var(--font-heading); font-size: 20px; font-weight: 600; letter-spacing: 0.02em; color: var(--color-accent-2-100)">VANTAGE CRE</span>
    </a>

    <div style="display:flex;align-items:center;gap:var(--space-6);">
      <a href="Search.dc.html" style="font-size: 14px; font-weight: 500; color: var(--color-accent-200)">New Search</a>
      <a href="Login.dc.html" style="font-size: 14px; font-weight: 500; color: var(--color-accent-200)">Logout</a>
      <a href="#" aria-label="Profile" style="display:block;width:40px;height:40px;border-radius:50%;overflow:hidden;flex-shrink:0;border:1px solid var(--color-neutral-400);">
        <image-slot id="profile-avatar" shape="circle" style="width:40px;height:40px;" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23dfe3e6'/%3E%3Ccircle cx='20' cy='16' r='7' fill='%235980a6'/%3E%3Ccircle cx='20' cy='42' r='16' fill='%235980a6'/%3E%3C/svg%3E" placeholder="Profile"></image-slot>
      </a>
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: var(--space-8) var(--space-6) calc(var(--space-8) * 2); box-sizing: border-box; background-color: var(--color-accent-2-100); padding-top: 80px">
    <div style="text-align:center;max-width:520px;">
      <h1 style="font-family:var(--font-heading);font-size:36px;font-weight:600;letter-spacing:0.01em;color:var(--color-text);margin:0 0 var(--space-2);">Land Sales Search</h1>
      <p style="font-size:15px;color:var(--color-neutral-700);margin:0;">Refine your search using the criteria below.</p>
    </div>

    <div style="display:flex;flex-direction:column;gap:var(--space-4);width:100%;max-width:640px;margin-top:var(--space-8);">

      <!-- Location -->
      <div class="blueprint elev-sm" style="position:relative;box-sizing:border-box;">
        <div onClick="{{ toggleLocation }}" style="display: flex; align-items: center; justify-content: space-between; padding: var(--space-4) var(--space-6); cursor: pointer; background-color: var(--color-accent-200)">
          <span style="font-family: var(--font-heading); font-size: 20px; font-weight: 600; color: var(--color-text); padding-left: 0px; padding-right: 0px">Location</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent-700)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="{{ locationChevronStyle }}"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
        <sc-if value="{{ locationOpen }}" hint-placeholder-val="{{ false }}" style="padding-left: 0px; padding-right: 0px">
          <div style="padding: 0 var(--space-6) var(--space-5); display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); padding-right: 20px; padding-left: 20px; padding-bottom: 20px; padding-top: 20px; background-color: var(--color-accent-2-100); border-width: 1px; border-style: solid; border-color: var(--color-neutral-300)">
            <div class="field"><label>State</label><input class="input" type="text" placeholder="e.g. Texas" style="background-color: #FFFFFF"></div>
            <div class="field"><label>MSA</label><input class="input" type="text" placeholder="e.g. Dallas-Fort Worth" style="background-color: #FFFFFF"></div>
            <div class="field"><label>County</label><input class="input" type="text" placeholder="e.g. Denton" style="background-color: #FFFFFF"></div>
            <div class="field"><label>City</label><input class="input" type="text" placeholder="e.g. Denton" style="background-color: #FFFFFF"></div>
          </div>
        </sc-if>
      </div>

      <!-- Type -->
      <div class="blueprint elev-sm" style="position:relative;box-sizing:border-box;">
        <div onClick="{{ toggleType }}" style="display: flex; align-items: center; justify-content: space-between; padding: var(--space-4) var(--space-6); cursor: pointer; background-color: var(--color-accent-200)">
          <span style="font-family: var(--font-heading); font-size: 20px; font-weight: 600; color: var(--color-text); padding-left: 0px; padding-right: 0px">Type</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent-700)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="{{ typeChevronStyle }}"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
        <sc-if value="{{ typeOpen }}" hint-placeholder-val="{{ false }}">
          <div style="padding: 0 var(--space-6) var(--space-5); display: flex; flex-wrap: wrap; gap: var(--space-3); padding-top: 20px; padding-right: 20px; padding-bottom: 20px; padding-left: 20px; background-color: var(--color-accent-100); border-width: 1px; border-style: solid; border-color: var(--color-neutral-300)">
            <sc-for list="{{ typeOptions }}" as="t" hint-placeholder-count="5">
              <div class="tag" onClick="{{ t.toggle }}" style="{{ t.tagStyle }}cursor:pointer;">{{ t.label }}</div>
            </sc-for>
          </div>
        </sc-if>
      </div>

      <!-- Size -->
      <div class="blueprint elev-sm" style="position: relative; box-sizing: border-box; padding-bottom: 0px">
        <div onClick="{{ toggleSize }}" style="display: flex; align-items: center; justify-content: space-between; padding: var(--space-4) var(--space-6); cursor: pointer; background-color: var(--color-accent-200)">
          <span style="font-family: var(--font-heading); font-size: 20px; font-weight: 600; color: var(--color-text); padding-left: 0px; padding-right: 0px">Size</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent-700)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="{{ sizeChevronStyle }}"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
        <sc-if value="{{ sizeOpen }}" hint-placeholder-val="{{ false }}">
          <div style="padding:0 var(--space-6) var(--space-5);display:flex;flex-direction:column;gap:var(--space-3);">

            <div style="border-top: 1px solid var(--color-neutral-300); display: block">
              <div onClick="{{ toggleSf }}" style="display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) 0; cursor: pointer; padding-right: 20px; padding-left: 20px; background-color: var(--color-accent-2-100); padding-top: 15px; padding-bottom: 5px">
                <span style="font-size: 14px; font-weight: 500; color: var(--color-text); padding-left: 0px; padding-right: 0px">Square Feet (SF)</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent-700)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="{{ sfChevronStyle }}"><polyline points="6 9 12 15 18 9"></polyline></svg>
              </div>
              <sc-if value="{{ sfOpen }}" hint-placeholder-val="{{ false }}" style="padding-right: 20px; padding-left: 20px">
                <div style="padding: 0 0 var(--space-4); display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); padding-left: 20px; padding-right: 20px">
                  <div class="field"><label>Min</label><input class="input" type="text" inputmode="numeric" placeholder="0" value="{{ sfMin }}" onChange="{{ setSfMin }}" style="background-color: #FFFFFF"></div>
                  <div class="field"><label>Max</label><input class="input" type="text" inputmode="numeric" placeholder="0" value="{{ sfMax }}" onChange="{{ setSfMax }}" style="background-color: #FFFFFF"></div>
                </div>
              </sc-if>
            </div>

            <div style="border-top: 1px solid var(--color-neutral-300); padding-bottom: 10px">
              <div onClick="{{ toggleAc }}" style="display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) 0; cursor: pointer; padding-right: 20px; padding-left: 20px; padding-top: 15px; padding-bottom: 5px">
                <span style="font-size: 14px; font-weight: 500; color: var(--color-text); padding-left: 0px; padding-right: 0px">Acreage (AC)</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent-700)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="{{ acChevronStyle }}"><polyline points="6 9 12 15 18 9"></polyline></svg>
              </div>
              <sc-if value="{{ acOpen }}" hint-placeholder-val="{{ false }}" style="padding-right: 20px; padding-left: 20px">
                <div style="padding: 0 0 var(--space-4); display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); padding-left: 20px; padding-right: 20px">
                  <div class="field"><label>Min</label><input class="input" type="text" inputmode="decimal" placeholder="0.00" value="{{ acMin }}" onChange="{{ setAcMin }}" style="background-color: #FFFFFF"></div>
                  <div class="field"><label>Max</label><input class="input" type="text" inputmode="decimal" placeholder="0.00" value="{{ acMax }}" onChange="{{ setAcMax }}" style="background-color: #FFFFFF"></div>
                </div>
              </sc-if>
            </div>

          </div>
        </sc-if>
      </div>

      <!-- Time -->
      <div class="blueprint elev-sm" style="position: relative; box-sizing: border-box; padding-bottom: 0px">
        <div onClick="{{ toggleTime }}" style="display: flex; align-items: center; justify-content: space-between; padding: var(--space-4) var(--space-6); cursor: pointer; background-color: var(--color-accent-200)">
          <span style="font-family: var(--font-heading); font-size: 20px; font-weight: 600; color: var(--color-text); padding-left: 0px; padding-right: 0px">Time</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent-700)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="{{ timeChevronStyle }}"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
        <sc-if value="{{ timeOpen }}" hint-placeholder-val="{{ false }}" style="padding-bottom: 0px; padding-top: 5px">
          <div style="padding:0 var(--space-6) var(--space-5);display:flex;flex-direction:column;gap:var(--space-3);">

            <div style="border-top:1px solid var(--color-neutral-300);">
              <div onClick="{{ toggleLast }}" style="display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) 0; cursor: pointer; padding-right: 20px; padding-left: 20px; padding-top: 15px; padding-bottom: 5px">
                <span style="font-size: 14px; font-weight: 500; color: var(--color-text); padding-left: 0px; padding-right: 0px">Last</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent-700)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="{{ lastChevronStyle }}"><polyline points="6 9 12 15 18 9"></polyline></svg>
              </div>
              <sc-if value="{{ lastOpen }}" hint-placeholder-val="{{ false }}" style="padding-right: 20px; padding-left: 20px">
                <div style="padding: 0 0 var(--space-4); display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); align-items: end; padding-left: 20px; padding-right: 20px">
                  <div class="field"><label>Duration</label><input class="input" type="number" placeholder="0" style="background-color: #FFFFFF"></div>
                  <div class="seg">
                    <label class="seg-opt" style="width: 100%"><input type="radio" name="last-unit" checked="{{ lastUnitIsMonths }}" onChange="{{ setLastUnitMonths }}"><span>Months</span></label>
                    <label class="seg-opt" style="width: 100%"><input type="radio" name="last-unit" checked="{{ lastUnitIsYears }}" onChange="{{ setLastUnitYears }}"><span>Years</span></label>
                  </div>
                </div>
              </sc-if>
            </div>

            <div style="border-top: 1px solid var(--color-neutral-300); padding-bottom: 10px">
              <div onClick="{{ toggleRange }}" style="display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) 0; cursor: pointer; padding-right: 20px; padding-left: 20px; padding-top: 15px; padding-bottom: 5px">
                <span style="font-size: 14px; font-weight: 500; color: var(--color-text); padding-left: 0px; padding-right: 0px">Range</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent-700)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="{{ rangeChevronStyle }}"><polyline points="6 9 12 15 18 9"></polyline></svg>
              </div>
              <sc-if value="{{ rangeOpen }}" hint-placeholder-val="{{ false }}" style="padding-right: 20px; padding-left: 20px">
                <div style="padding: 0 0 var(--space-4); display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); padding-left: 20px; padding-right: 20px">
                  <div class="field"><label>From</label><input class="input" type="date" style="background-color: #FFFFFF"></div>
                  <div class="field"><label>To</label><input class="input" type="date" style="background-color: #FFFFFF"></div>
                </div>
              </sc-if>
            </div>

          </div>
        </sc-if>
      </div>

    </div>
  </main>

  <a href="SalesSearch.dc.html" class="blueprint" style="position:fixed;bottom:var(--space-6);left:var(--space-6);display:flex;align-items:center;gap:var(--space-3);padding:var(--space-4) var(--space-6);background:var(--color-bg);color:var(--color-text);box-shadow:var(--shadow-md);text-decoration:none;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    <span style="font-family:var(--font-heading);font-size:16px;font-weight:600;letter-spacing:0.03em;">BACK</span>
  </a>

  <button type="button" class="blueprint" onClick="{{ handleContinue }}" style="position:fixed;bottom:var(--space-6);right:var(--space-6);display:flex;align-items:center;gap:var(--space-3);padding:var(--space-4) var(--space-6);background:var(--color-accent-600);color:var(--color-bg);border:none;cursor:pointer;box-shadow:var(--shadow-md);">
    <span style="font-family:var(--font-heading);font-size:16px;font-weight:600;letter-spacing:0.03em;">CONTINUE</span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
  </button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const TYPE_OPTIONS = ['Residential', 'Multifamily', 'Retail', 'Office', 'Industrial'];

class Component extends DCLogic {
  state = {
    locationOpen: true,
    typeOpen: false,
    sizeOpen: false,
    timeOpen: false,
    sfOpen: false,
    acOpen: false,
    lastOpen: false,
    rangeOpen: false,
    selectedTypes: [],
    lastUnit: 'months',
    sfMin: '', sfMax: '', acMin: '', acMax: ''
  };

  formatWithCommas(raw) {
    let clean = raw.replace(/[^0-9.]/g, '');
    const firstDot = clean.indexOf('.');
    if (firstDot !== -1) clean = clean.slice(0, firstDot + 1) + clean.slice(firstDot + 1).replace(/\./g, '');
    const [intPart, decPart] = clean.split('.');
    const withCommas = (intPart || '').replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return decPart !== undefined ? `${withCommas}.${decPart}` : withCommas;
  }

  setFormattedField = (key) => (e) => this.setState({ [key]: this.formatWithCommas(e.target.value) });

  toggle = (key) => this.setState(s => ({ [key]: !s[key] }));

  toggleTypeOption = (label) => this.setState(s => ({
    selectedTypes: s.selectedTypes.includes(label)
      ? s.selectedTypes.filter(t => t !== label)
      : [...s.selectedTypes, label]
  }));

  handleContinue = () => {
    window.location.href = 'Database.dc.html';
  };

  chevronStyle(open) {
    return `transition:transform 0.15s ease;transform:rotate(${open ? '180deg' : '0deg'});flex-shrink:0;`;
  }

  renderVals() {
    const s = this.state;
    const typeOptions = TYPE_OPTIONS.map(label => {
      const selected = s.selectedTypes.includes(label);
      return {
        label,
        tagStyle: `background:${selected ? 'var(--color-accent-600)' : '#FFFFFF'};color:${selected ? '#FFFFFF' : 'var(--color-neutral-900)'};border:1px solid ${selected ? 'var(--color-accent-600)' : 'var(--color-neutral-400)'};`,
        toggle: () => this.toggleTypeOption(label)
      };
    });

    return {
      locationOpen: s.locationOpen,
      typeOpen: s.typeOpen,
      sizeOpen: s.sizeOpen,
      timeOpen: s.timeOpen,
      sfOpen: s.sfOpen,
      acOpen: s.acOpen,
      lastOpen: s.lastOpen,
      rangeOpen: s.rangeOpen,
      toggleLocation: () => this.toggle('locationOpen'),
      toggleType: () => this.toggle('typeOpen'),
      toggleSize: () => this.toggle('sizeOpen'),
      toggleTime: () => this.toggle('timeOpen'),
      toggleSf: () => this.toggle('sfOpen'),
      toggleAc: () => this.toggle('acOpen'),
      toggleLast: () => this.toggle('lastOpen'),
      toggleRange: () => this.toggle('rangeOpen'),
      locationChevronStyle: this.chevronStyle(s.locationOpen),
      typeChevronStyle: this.chevronStyle(s.typeOpen),
      sizeChevronStyle: this.chevronStyle(s.sizeOpen),
      timeChevronStyle: this.chevronStyle(s.timeOpen),
      sfChevronStyle: this.chevronStyle(s.sfOpen),
      acChevronStyle: this.chevronStyle(s.acOpen),
      lastChevronStyle: this.chevronStyle(s.lastOpen),
      rangeChevronStyle: this.chevronStyle(s.rangeOpen),
      typeOptions,
      lastUnitIsMonths: s.lastUnit === 'months',
      lastUnitIsYears: s.lastUnit === 'years',
      setLastUnitMonths: () => this.setState({ lastUnit: 'months' }),
      setLastUnitYears: () => this.setState({ lastUnit: 'years' }),
      sfMin: s.sfMin, sfMax: s.sfMax, acMin: s.acMin, acMax: s.acMax,
      setSfMin: this.setFormattedField('sfMin'),
      setSfMax: this.setFormattedField('sfMax'),
      setAcMin: this.setFormattedField('acMin'),
      setAcMax: this.setFormattedField('acMax'),
      handleContinue: this.handleContinue
    };
  }
}
</script>
</body>
</html>
