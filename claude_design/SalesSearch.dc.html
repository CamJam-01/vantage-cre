<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/industry-f4035e7d-525b-4f20-b25f-6e55ddf79c74/styles.css">
  <script src="_ds/industry-f4035e7d-525b-4f20-b25f-6e55ddf79c74/_ds_bundle.js"></script>
  <script src="./image-slot.js"></script>
  <style>
    body { margin: 0; background: var(--color-bg); }
    a { color: var(--color-accent-700); text-decoration: none; }
    a:hover { color: var(--color-accent-900); text-decoration: underline; }
  </style>
</helmet>
<div style="min-height:100vh;width:100%;font-family:var(--font-body);display:flex;flex-direction:column;">

  <header style="position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--color-neutral-300); display: flex; align-items: center; justify-content: space-between; padding: var(--space-4) var(--space-6); box-sizing: border-box; background-color: var(--color-accent)">
    <a href="Search.dc.html" style="display:flex;align-items:center;gap:var(--space-3);text-decoration:none;">
      <div class="blueprint" style="position:relative;width:32px;height:32px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent-700)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="stroke: var(--color-accent-200)"><path d="M3 21h18" stroke="var(--color-accent-200)"></path><path d="M5 21V7l8-4v18" stroke="var(--color-accent-200)"></path><path d="M19 21V11l-6-4" stroke="var(--color-accent-200)"></path><path d="M9 9v.01" stroke="var(--color-accent-200)"></path><path d="M9 12v.01" stroke="var(--color-neutral-400)"></path><path d="M9 15v.01" stroke="var(--color-accent-200)"></path><path d="M9 18v.01" stroke="var(--color-accent-200)"></path></svg>
      </div>
      <span style="font-family: var(--font-heading); font-size: 20px; font-weight: 600; letter-spacing: 0.02em; color: var(--color-accent-2-100)">VANTAGE CRE</span>
    </a>

    <div style="display:flex;align-items:center;gap:var(--space-6);">
      <a href="Search.dc.html" style="font-size: 14px; font-weight: 500; color: var(--color-accent-200)">New Search</a>
      <a href="Login.dc.html" style="font-size: 14px; font-weight: 500; color: var(--color-accent-200)">Logout</a>
      <a href="UserProfile.dc.html" aria-label="Profile" style="display:block;width:40px;height:40px;border-radius:50%;overflow:hidden;flex-shrink:0;border:1px solid var(--color-neutral-400);">
        <image-slot id="profile-avatar" shape="circle" style="width:40px;height:40px;" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23dfe3e6'/%3E%3Ccircle cx='20' cy='16' r='7' fill='%235980a6'/%3E%3Ccircle cx='20' cy='42' r='16' fill='%235980a6'/%3E%3C/svg%3E" placeholder="Profile"></image-slot>
      </a>
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: var(--space-8) var(--space-6) var(--space-8); box-sizing: border-box; background-color: var(--color-accent-2-100); padding-top: 80px">
    <div style="text-align:center;max-width:520px;">
      <h1 style="font-family:var(--font-heading);font-size:36px;font-weight:600;letter-spacing:0.01em;color:var(--color-text);margin:var(--space-3) 0 var(--space-2);">Sales Search</h1>
      <p style="font-size:15px;color:var(--color-neutral-700);margin:0;">Choose a property type to continue.</p>
    </div>

    <div style="display:flex;flex-direction:column;gap:var(--space-4);width:100%;max-width:520px;margin-top:var(--space-8);">
      <sc-for list="{{ options }}" as="opt" hint-placeholder-count="3">
        <div class="blueprint elev-sm" onClick="{{ opt.select }}" style="{{ opt.cardStyle }}">
            <div style="{{ opt.checkboxStyle }}" dangerouslySetInnerHTML="{{ opt.checkboxHtml }}"></div>
          <div style="text-align:left;">
            <div style="font-family:var(--font-heading);font-size:20px;font-weight:600;letter-spacing:0.01em;color:var(--color-text);">{{ opt.label }}</div>
          </div>
        </div>
      </sc-for>
    </div>
  </main>

  <a href="Search.dc.html" class="blueprint" style="position:fixed;bottom:var(--space-6);left:var(--space-6);display:flex;align-items:center;gap:var(--space-3);padding:var(--space-4) var(--space-6);background:var(--color-bg);color:var(--color-text);box-shadow:var(--shadow-md);text-decoration:none;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    <span style="font-family:var(--font-heading);font-size:16px;font-weight:600;letter-spacing:0.03em;">BACK</span>
  </a>

  <button type="button" class="blueprint" onClick="{{ handleContinue }}" style="{{ continueStyle }}">
    <span style="font-family:var(--font-heading);font-size:16px;font-weight:600;letter-spacing:0.03em;">CONTINUE</span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="{{ arrowStyle }}"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
  </button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const CHECK_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-bg)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

const OPTIONS = [
  { key: 'land', label: 'Land', disabled: false },
  { key: 'improved', label: 'Improved', disabled: true },
  { key: 'ground-leases', label: 'Ground Leases', disabled: true }
];

class Component extends DCLogic {
  state = { selected: null };

  select = (key) => this.setState({ selected: key });

  handleContinue = () => {
    if (!this.state.selected) return;
    if (this.state.selected === 'land') window.location.href = 'LandSalesSearch.dc.html';
  };

  renderVals() {
    const selected = this.state.selected;
    const options = OPTIONS.map(o => {
      const isSelected = selected === o.key;
      return {
        ...o,
        select: o.disabled ? () => {} : () => this.select(o.key),
        checkboxHtml: { __html: isSelected ? CHECK_SVG : '' },
        checkboxStyle: `flex-shrink:0;width:22px;height:22px;border:1.5px solid ${isSelected ? 'var(--color-accent-600)' : 'var(--color-neutral-500)'};background:${isSelected ? 'var(--color-accent-600)' : '#FFFFFF'};display:flex;align-items:center;justify-content:center;transition:background 0.15s ease, border-color 0.15s ease;`,
        cardStyle: `position:relative;padding:var(--space-4) var(--space-6);display:flex;flex-direction:row;align-items:center;gap:var(--space-4);box-sizing:border-box;background:#D6EBFF;outline:${isSelected ? '2px solid var(--color-accent-600)' : 'none'};outline-offset:-1px;transition:background 0.15s ease;${o.disabled ? 'opacity:0.45;cursor:not-allowed;' : 'cursor:pointer;'}`
      };
    });

    const hasSelection = !!selected;

    return {
      options,
      handleContinue: this.handleContinue,
      continueStyle: `position:fixed;bottom:var(--space-6);right:var(--space-6);display:flex;align-items:center;gap:var(--space-3);padding:var(--space-4) var(--space-6);background:${hasSelection ? 'var(--color-accent-600)' : 'var(--color-neutral-300)'};color:${hasSelection ? 'var(--color-bg)' : 'var(--color-neutral-600)'};border:none;cursor:${hasSelection ? 'pointer' : 'not-allowed'};opacity:${hasSelection ? '1' : '0.45'};pointer-events:${hasSelection ? 'auto' : 'none'};box-shadow:var(--shadow-md);`,
      arrowStyle: 'transition:transform 0.15s ease;'
    };
  }
}
</script>
</body>
</html>
